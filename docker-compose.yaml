services:
  app:
    build: .
    container_name: babycode-app
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - C:\babycode-workspace:/babycode-workspace
    environment:
      - WORKSPACE_DIR=/babycode-workspace
      - WORKSPACE_HOST_DIR=C:\babycode-workspace